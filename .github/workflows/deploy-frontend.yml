name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: yarn build
        env:
          CI: false
          REACT_APP_ENABLE_VISUAL_EDITS: true
          ENABLE_HEALTH_CHECK: false
          # Supabase (backend baru). Anon key aman dipublik: dirancang untuk
          # frontend & dilindungi Row Level Security. JANGAN taruh service_role di sini.
          REACT_APP_SUPABASE_URL: https://ofdeyqwspolppnudebuq.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mZGV5cXdzcG9scHBudWRlYnVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTU5NjEsImV4cCI6MjA5NTg3MTk2MX0.w7AytvyRnvIkIYMVdsIWaYx1vHIHMBG7tAMVx7lkokM

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
